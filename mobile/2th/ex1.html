<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            color: #333;
        }

        h1 {
            font-size: 28px;
            font-weight: bold;
            margin-top: 20px;
            margin-bottom: 15px;
        }

        /* Styling cho danh sách */
        ul {
            list-style-type: disc;
            padding-left: 20px;
        }

        ol {
            padding-left: 20px;
        }

        /* Danh sách có thứ tự tùy chỉnh số bắt đầu */
        .list-1 {
            list-style-type: decimal;
        }

        .list-2 {
            list-style-type: lower-roman;
        }

        /* Styling cho bảng (table) */
        table.custom-table {
            border-collapse: separate;
            border-spacing: 2px;
            border: 1px solid #333;
            background-color: #fff;
        }

        table.custom-table td {
            border: 1px solid #333;
            padding: 3px 6px;
            text-align: center;
            font-family: sans-serif;
            font-size: 15px;
            white-space: nowrap;
        }

        /* Styling cho phần liên kết bên dưới */
        .links p {
            margin: 5px 0;
        }

        .links a {
            color: #0000ee;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    
    <h1>목록 태그</h1>
    <ul>
        <li>마크업 언어
            <ol class="list-1">
                <li>HTML</li>
                <li>XML</li>
                <li value="10">SGML</li>
            </ol>
        </li>
        <li>웹브라우저
            <ol class="list-2" start="3">
                <li>인터넷익스플로러</li>
                <li>크롬</li>
                <li>사파리</li>
                <li>파이어폭스</li>
                <li>오페라</li>
            </ol>
        </li>
    </ul>

    <hr style="border: none; border-top: 1px solid #ccc; margin: 30px 0;">

   
    <h1>테이블 태그</h1>
    <table class="custom-table">
        <!-- Hàng 1 -->
        <tr>
            <td>셀(1,1)</td>
            <td>셀(1,2)</td>
            <td>셀(1,3)</td>
        </tr>
        <!-- Hàng 2 -->
        <tr>
            <td rowspan="3">셀(2,1)</td>
            <td>셀(2,2)</td>
            <td>셀(2,3)</td>
        </tr>
        <!-- Hàng 3 -->
        <tr>
            <td colspan="2">셀(3,1)</td>
        </tr>
        <!-- Hàng 4 -->
        <tr>
            
            <td>셀(4,1)</td>
            <td>셀(4,2)</td>
        </tr>
    </table>
    
    <div class="links">
        <p>웹 사이트 이동 => <a href="https://www.google.com">구글 사이트</a></p>
        <p>웹 문서간 이동 => <a href="#">html 글자 태그 실습 예제</a></p>
        <p>문서 내 이동 => <a href="#">목록 태그 예</a></p>
    </div>
</body>
</html>
